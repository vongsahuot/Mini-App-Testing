server:
  port: 8081

spring:
  jpa:
    properties:
      hibernate:
        default_schema: portal

mock:
  actor: KP
  pairwise-salt: ${PAIRWISE_SALT:kosign-pairwise-salt}
  payment-ttl-minutes: 10
  auth-code-ttl-seconds: 60
  # Real system: scan every 1-2 min for PROCESSING > 3 min. Shortened so tests run quickly.
  recovery:
    interval-ms: ${RECOVERY_INTERVAL_MS:15000}
    stuck-after-seconds: ${RECOVERY_STUCK_AFTER_SECONDS:60}
    lock-timeout-seconds: ${RECOVERY_LOCK_TIMEOUT_SECONDS:120}
  webhook:
    first-retry-seconds: 5
    max-retry-interval-seconds: 600
    give-up-after-hours: 24
  seed:
    partner-entry-url: ${PARTNER_ENTRY_URL:http://localhost:3000/partner/movie-tickets}
    partner-allowed-origins: ${PARTNER_ALLOWED_ORIGINS:http://localhost:3000}
    partner-webhook-url: ${PARTNER_WEBHOOK_URL:http://localhost:8083/webhooks/kosign}
    partner-secret: ${PARTNER_SECRET:partner-secret-movie}
