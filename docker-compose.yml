name: minipay

x-backend: &backend
  build: ./backend
  image: minipay-backend:local
  restart: on-failure
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-env
    DB_HOST: db
    DB_PORT: "5432"
    PORTAL_URL: http://portal:8081
    BANK_URL: http://bank:8082
    PARTNER_URL: http://partner:8083
    # Browser-facing URL of the web app (entry URLs, app links, payLinks).
    WEB_URL: http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minipay
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay -d minipay"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Mini App Service (MAS), partner gateway (PG) and the Kafka mock (KF)
  portal:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: portal
    ports:
      - "8081:8081"

  # App gateway (PG), Mobile Backend (MBE), Local Gateway (LG) and Core Banking (CB)
  bank:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: bank
    ports:
      - "8082:8082"

  # Partner server, "Starlight Cinema" (PS)
  partner:
    <<: *backend
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: partner
    ports:
      - "8083:8083"

  # Next.js: MB App simulator (APP), partner page (PC), SDK, partner app (PA) and the test console
  web:
    build: ./web
    image: minipay-web:local
    restart: on-failure
    depends_on:
      - portal
      - bank
      - partner
    ports:
      - "3000:3000"

volumes:
  db-data:
